server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control no-cache;

    location = /healthz { access_log off; return 200 'ok'; }
    location = / { return 302 /admin/; }
    location = /h5 { return 301 /h5/; }
    location = /admin { return 301 /admin/; }
    location ~ ^/(h5|admin)/assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location /h5/ { try_files $uri $uri/ /h5/index.html; }
    location /admin/ { try_files $uri $uri/ /admin/index.html; }
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # This listener is only reached through the corporate HTTPS ingress.
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
    # Actuator and private export files are not public routes.
    location / { return 404; }
}
