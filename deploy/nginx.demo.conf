# Temporary, password-protected demo. Mount only the two dist-demo directories
# under /html, and publish this listener on the host's loopback address only.
map $request_method $demo_login_key {
    default "";
    POST "demo";
}
# ponytail: one shared preview login limit; use per-identity limits with real accounts.
limit_req_zone $demo_login_key zone=demo_login:1m rate=30r/m;

server {
    listen 80;
    server_name _;
    root /html;
    server_tokens off;
    # TLS terminates at Cloudflare; keep relative redirects on the browser's HTTPS origin.
    absolute_redirect off;
    client_max_body_size 10m;

    if ($http_x_forwarded_proto = http) { return 308 https://$host$request_uri; }

    auth_request /_demo_access;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control no-store always;

    # This redirect contains no application data. All destination content is protected.
    location = / { return 302 /admin/; }
    location = /admin { rewrite ^ /admin/ last; }
    location = /h5 { rewrite ^ /h5/ last; }

    # A regular form and same-origin session work without a browser HTTP-auth dialog.
    location = /demo-access/login {
        auth_request off;
        limit_req zone=demo_login burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 4k;
        proxy_pass http://api:8081;
    }
    location = /demo-access/tokens.css {
        auth_request off;
        alias /html/demo-access-tokens.css;
    }
    location = /_demo_access {
        internal;
        auth_request off;
        proxy_pass http://api:8081/demo-access/check;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization "";
    }
    location @demo_h5_login { return 302 /demo-access/login?target=h5; }
    location @demo_admin_login { return 302 /demo-access/login?target=admin; }
    location @demo_api_denied {
        default_type application/json;
        return 401 '{"code":"DEMO_ACCESS_REQUIRED","message":"演示访问已失效，请刷新页面后输入访问口令"}';
    }

    # Never serve source files, source maps, hidden files, or development endpoints.
    location ~* (^|/)\.|\.(map|vue|ts|tsx|jsx|sql|yaml|yml|toml)$ { return 404; }
    location ~ ^/(admin|h5)/(src|node_modules|@vite|@fs)(/|$) { return 404; }

    location ~ ^/(h5|admin)/assets/ { try_files $uri =404; }
    location /h5/ {
        error_page 401 = @demo_h5_login;
        try_files $uri $uri/ /h5/index.html;
    }
    location /admin/ {
        error_page 401 = @demo_admin_login;
        try_files $uri $uri/ /admin/index.html;
    }

    location /api/ {
        proxy_pass http://api:8081;
        # Only gateway denials use this response; business 401/403 responses pass through.
        error_page 401 = @demo_api_denied;
    }

    # No public health endpoint, Actuator, private exports, or repository routes.
    location / { return 404; }
}
